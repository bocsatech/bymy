# S1 nginx — bymy.hu origin (Cloudflare proxied DNS mellett).
# Előfeltétel (http {}):
#   include /etc/nginx/cloudflare-realip.conf;
#   include /etc/nginx/cloudflare-geo.conf;
#
# Generálás: ./scripts/update-cloudflare-nginx-ips.sh

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bymy.hu www.bymy.hu;

    # Csak Cloudflare edge (vagy localhost) — $realip_remote_addr alapján
    if ($is_cloudflare_edge = 0) {
        return 403;
    }

    client_max_body_size 25m;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    location / {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }
}
