<!DOCTYPE html>
<html lang="hu">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bymy-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' font-family='system-ui,sans-serif' font-weight='700'%3EB%3C/text%3E%3C/svg%3E" type="image/svg+xml" />
    <meta name="bymy-version" content="regGate1" />
    <title>Regisztráció — Bymy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css?v=authGate1" />
    <link rel="stylesheet" href="/css/auth-gate.css?v=gate2" />
    <link rel="stylesheet" href="/css/bymy-logo-size.css?v=logoHalf1" />
  </head>
  <body class="auth-gate-page login-page" data-site-page="regisztracio" data-auth-init="manual">
    <main class="auth-gate-main">
      <section class="auth-gate-card login-card" aria-labelledby="register-title">
        <img class="auth-gate-logo" src="/images/bymy-logo.png?v=logoUpload1" alt="Bymy.hu" width="160" height="40" decoding="async" />
        <h1 class="auth-gate-title login-title" id="register-title">Regisztráció</h1>
        <p class="auth-gate-lead login-lead">Hozz létre fiókot a Bymy használatához.</p>
        <fieldset id="account-type-pick" class="account-type-pick">
          <legend class="account-type-pick__legend">Fióktípus</legend>
          <p class="account-type-pick__hint">Kötelező választás — Google / email előtt is. Később nem módosítható.</p>
          <label class="account-type-option" data-account-type-option="private">
            <input type="radio" name="accountType" value="private" form="register-form" />
            <span class="account-type-option__text">
              <strong>Privát fiók</strong>
              <small>Magánszemélyként hirdetsz</small>
            </span>
          </label>
          <label class="account-type-option" data-account-type-option="business">
            <input type="radio" name="accountType" value="business" form="register-form" />
            <span class="account-type-option__text">
              <strong>Céges fiók</strong>
              <small>Vállalkozásként / cégként hirdetsz</small>
            </span>
          </label>
        </fieldset>
        <p id="register-error" class="login-error" role="alert" hidden></p>
        <div class="oauth-block" data-oauth-buttons>
          <button type="button" class="oauth-btn oauth-btn--google" data-oauth-provider="google">
            <span class="oauth-btn-icon" aria-hidden="true">G</span>
            Folytatás Google-lal
          </button>
          <button type="button" class="oauth-btn oauth-btn--apple" data-oauth-provider="apple">
            <span class="oauth-btn-icon" aria-hidden="true"></span>
            Folytatás Apple-lel
          </button>
          <button type="button" class="oauth-btn oauth-btn--facebook" data-oauth-provider="facebook">
            <span class="oauth-btn-icon" aria-hidden="true">f</span>
            Folytatás Facebookkal
          </button>
          <p class="oauth-hint" data-oauth-hint hidden></p>
        </div>
        <div class="login-divider" aria-hidden="true"><span>vagy emaillel</span></div>
        <form id="register-form" class="login-form">
          <label class="login-field">
            <span class="login-label">Email</span>
            <input type="email" name="email" autocomplete="username" required placeholder="pelda@email.hu" />
          </label>
          <label class="login-field">
            <span class="login-label">Jelszó</span>
            <input type="password" name="password" autocomplete="new-password" required minlength="12" />
          </label>
          <label class="login-field">
            <span class="login-label">Jelszó megerősítése</span>
            <input type="password" name="password_confirm" autocomplete="new-password" required minlength="12" />
          </label>
          <button type="submit" class="site-header-btn site-header-btn--primary login-submit" disabled>Regisztráció</button>
        </form>
        <div id="register-ok" class="login-lead" hidden></div>
        <p class="auth-gate-footer login-hint">Már van fiókod? <a href="/belepes.html">Belépés</a></p>
      </section>
    </main>

    <script type="module">
      import { initRegisterPage } from "/js/site-auth.js?v=oauthRestore1";
      initRegisterPage();
    </script>
    <script src="/js/theme.js?v=gate1" type="module"></script>
  </body>
</html>
