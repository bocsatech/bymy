<!DOCTYPE html>
<html lang="hu">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bymy-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
        try {
          var raw = sessionStorage.getItem("bymy-auth-user");
          var user = raw ? JSON.parse(raw) : null;
          var loggedIn = !!(user && user.email);
          document.documentElement.setAttribute("data-auth", loggedIn ? "member" : "guest");
          if (!loggedIn) {
            window.location.replace("/belepes.html?next=" + encodeURIComponent("/fiok.html"));
          }
        } catch (e) {
          document.documentElement.setAttribute("data-auth", "guest");
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fiókom — Bymy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/site-app.css?v=settingsOpen1" />
    <link rel="stylesheet" href="/css/fiok-menu.css?v=fiokWebMenu1" />
    <link rel="stylesheet" href="/css/hub-mobile-app.css?v=tabHideScroll1" />
    <link rel="stylesheet" href="/css/bymy-logo-size.css?v=logoHalf1" />
  </head>
  <body class="site-app fiok-page settings-page" data-site-page="fiok">
    <script src="/js/mw-app-shell.js?v=tabHideScroll1"></script>
    <header class="fiok-top">
      <a class="fiok-back" href="/" aria-label="Vissza">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Vissza</span>
      </a>
      <h1 class="fiok-title">Fiókom</h1>
      <span class="fiok-top-spacer" aria-hidden="true"></span>
    </header>

    <main class="fiok-main">
      <!-- Ugyanaz a menü, mint a Beállítások oldalsáv (/beallitasok.html) -->
      <aside class="mm-side" aria-label="Fiók menü">
        <p class="mm-side-kicker">Fiókom <span class="mm-side-account-type" data-mm-account-type hidden></span></p>
        <h2 class="mm-side-title">Üdv, <span data-mm-hello>—</span></h2>
        <nav class="mm-nav">
          <div class="mm-nav-group" data-mm-company-nav-wrap hidden>
            <a class="mm-nav-link" href="/beallitasok.html?szekcio=cegadatok" data-mm-nav="cegadatok">Cégadatok</a>
          </div>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=import" data-mm-nav="import">Autóimport</a>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=nyomtatasok" data-mm-nav="nyomtatasok">Nyomtatások</a>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=ertekelesek" data-mm-nav="ertekelesek">Értékelések</a>
          <p class="mm-nav-plain">Kiemelések</p>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=parkolo" data-mm-nav="parkolo">Parkoló</a>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=hirdetes" data-mm-nav="hirdetes">Saját hirdetések</a>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=keresesek" data-mm-nav="keresesek">Mentett kereséseim</a>
          <a class="mm-nav-link" href="/uzenetek.html" data-mm-nav="uzenetek">Üzenetek <span class="mm-nav-badge" data-mm-msg-count hidden>0</span></a>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=szemelyes" data-mm-nav="szemelyes">Személyes adatok</a>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=keresesi-korzet" data-mm-nav="keresesi-korzet">Keresési körzet</a>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=ajanlasok-korzet" data-mm-nav="ajanlasok-korzet">Ajánlások körzete</a>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=jelszo" data-mm-nav="jelszo">Jelszó módosítása</a>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=notify" data-mm-nav="notify">Hírlevél és értesítések</a>
          <a class="mm-nav-link" href="/beallitasok.html?szekcio=megjelenes" data-mm-nav="megjelenes">Megjelenés</a>
        </nav>
        <button type="button" class="mm-side-logout" data-auth-logout>Kijelentkezés</button>
      </aside>
    </main>

    <script type="module">
      import { initSiteAuth, getAuthUser, getProfile } from "/js/site-auth.js?v=fiokWebMenu1";

      initSiteAuth();

      function firstName(user) {
        const fromProfile = String(user?.profile?.firstName || "").trim();
        if (fromProfile) return fromProfile;
        const display = String(user?.displayName || "").trim();
        if (display && !display.includes("@")) return display.split(/\s+/)[0] || "";
        const email = String(user?.email || "").trim();
        if (!email) return "";
        const local = email.split("@")[0] || "";
        return local ? local.charAt(0).toUpperCase() + local.slice(1) : "";
      }

      function syncSidebar() {
        const user = getAuthUser();
        const profile = getProfile?.() || user?.profile || {};
        const hello = document.querySelector("[data-mm-hello]");
        if (hello) hello.textContent = firstName(user) || "—";

        const type = String(profile.accountType || "").trim();
        const isCompany = type === "business" || type === "dealer";
        const typeEl = document.querySelector("[data-mm-account-type]");
        if (typeEl) {
          if (isCompany) {
            typeEl.hidden = false;
            typeEl.textContent = type === "dealer" ? "Kereskedő" : "Cég";
          } else {
            typeEl.hidden = true;
            typeEl.textContent = "";
          }
        }
        document.querySelectorAll("[data-mm-company-nav-wrap]").forEach((el) => {
          el.hidden = !isCompany;
        });
      }

      syncSidebar();
      window.addEventListener("bymy-auth-changed", syncSidebar);
    </script>
  </body>
</html>
