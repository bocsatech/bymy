<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HA import — 1. lépés box demó</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #e8edf3;
      color: #111;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
    }
    .page-title {
      margin: 0 0 1rem;
      font-size: 1.35rem;
      font-weight: 700;
      color: #111;
    }
    /* Referencia: fehér box, sötétkék keret, lekerekített sarkok */
    .step-box {
      background: #fff;
      border: 1.5px solid #1e4d7b;
      border-radius: 14px;
      padding: 1.1rem 1.15rem 1.15rem;
    }
    .step-title {
      margin: 0 0 0.85rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #111;
      line-height: 1.3;
    }
    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }
    .mode {
      border: 0;
      background: #fff;
      color: #667085;
      padding: 0.75rem 0.7rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      text-align: center;
      min-height: 2.75rem;
    }
    .mode + .mode { border-left: 1px solid #d0d5dd; }
    .mode.is-active {
      background: #1e4d7b;
      color: #fff;
    }
    .note {
      margin: 1.25rem 0 0;
      font-size: 0.85rem;
      color: #667085;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="page-title">Használtautó import</h1>
    <div class="step-box">
      <h2 class="step-title">1 Válaszd ki a profilod típusát</h2>
      <div class="modes" role="tablist">
        <button type="button" class="mode is-active">Privát felhasználó</button>
        <button type="button" class="mode">Kereskedő</button>
      </div>
    </div>
    <p class="note">Demó: csak az 1. lépés külön fehér boxban, sötétkék kerettel, lekerekített sarkokkal. A cím a boxon kívül marad.</p>
  </div>
</body>
</html>
