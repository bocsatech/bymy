<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiemelt — mindkét mező a kép alatt</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../../public/css/listing-featured.css" />
    <style>
      :root {
        --ink: #111;
        --muted: #666;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "DM Sans", system-ui, sans-serif;
        background: #eef0f3;
        color: var(--ink);
        padding: 28px 20px 48px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.25rem;
      }
      p.lead {
        margin: 0 0 24px;
        max-width: 42rem;
        line-height: 1.45;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .card {
        background: #fff;
        border-radius: 9px;
        overflow: hidden;
        max-width: 360px;
      }
      .card.home-grid-card--featured {
        border: 2px solid var(--listing-featured-yellow);
        box-shadow: 0 8px 22px rgba(240, 193, 75, 0.22);
      }
      .media {
        position: relative;
        aspect-ratio: 16 / 10;
        background: #e8ebef;
      }
      .media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .body {
        padding: 10px 14px 14px;
        display: block;
        text-decoration: none;
        color: inherit;
      }
      .title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 800;
      }
      .sub {
        margin: 4px 0 0;
        font-size: 0.9rem;
      }
      .price {
        display: block;
        margin-top: 8px;
        font-size: 1.35rem;
        font-weight: 800;
        color: #0d47a1;
      }
    </style>
  </head>
  <body>
    <h1>Kiemelt csempe</h1>
    <p class="lead">
      <strong>KIEMELT</strong> és <strong>TOP AJÁNLAT</strong> egy sorban a kép alatt (éles
      <code>listing-featured.css</code> stílusokkal).
    </p>

    <article class="card home-grid-card home-grid-card--featured">
      <div class="media home-grid-card-media">
        <img src="kiemelt-demo-auto.png" alt="" width="640" height="400" />
      </div>
      <a class="body home-grid-card-body" href="#">
        <span class="listing-featured-under-photo" aria-hidden="true">
          <span class="listing-featured-badge listing-featured-badge--under-photo">KIEMELT</span>
          <span class="listing-featured-ribbon listing-featured-ribbon--under-photo">TOP AJÁNLAT</span>
        </span>
        <h2 class="title home-grid-card-title">Mercedes-Benz ML-OSZTÁLY</h2>
        <p class="sub">Dízel</p>
        <strong class="price home-grid-card-price">3 700 000 Ft</strong>
      </a>
    </article>
  </body>
</html>
