<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demó — osztott év|hó sheet</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; background: #c5ccd4; }
  .phone {
    width: 390px; height: 844px; margin: 0 auto; background: #f4f6f8;
    position: relative; overflow: hidden;
  }
  .form { padding: 1.25rem 1rem 2rem; }
  .label {
    margin: 0 0 0.55rem;
    font: 700 0.875rem/1.2 system-ui, sans-serif;
    color: #111;
  }
  .label .req { color: #dc2626; }
  .split { display: flex; gap: 0.65rem; width: 100%; }
  .cell {
    flex: 1 1 0; min-width: 0;
    min-height: 2.75rem;
    border: 1.5px solid #111;
    border-radius: 0.55rem;
    background: #fff;
    display: flex; align-items: center;
    padding: 0.55rem 0.85rem;
    font: 600 1rem/1.2 system-ui, sans-serif;
    color: #6b7280;
  }
  .cell.has-value { color: #0f172a; }
  .portal { position: absolute; inset: 0; z-index: 10; }
  .backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.22); }
  .stage {
    position: absolute; inset: 0;
    background: #e8eef3;
    display: flex; flex-direction: column;
  }
  .head {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1rem 0.55rem;
  }
  .close {
    width: 2.35rem; height: 2.35rem; border: 0; border-radius: 999px;
    background: #fff; color: #111; font: 500 1.35rem/1 system-ui, sans-serif;
    box-shadow: 0 1px 3px rgba(15,23,42,.12);
  }
  .title {
    margin: 0; text-align: center;
    font: 600 1.05rem/1.2 system-ui, sans-serif; color: #111;
  }
  .done {
    border: 0; border-radius: 999px;
    background: #f5c518; color: #111;
    font: 600 0.9rem/1 system-ui, sans-serif;
    padding: 0.55rem 1.1rem;
    box-shadow: 0 2px 8px rgba(245,197,24,.35);
  }
  .body {
    flex: 1 1 auto; min-height: 0;
    padding: 0.35rem 1rem 1rem;
    display: flex; flex-direction: column;
  }
  .card {
    flex: 1 1 auto; min-height: 0;
    background: #fff;
    border-radius: 1.15rem 1.15rem 0 0;
    box-shadow: 0 1px 3px rgba(15,23,42,.06);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .chip-row {
    padding: 0.65rem 0.85rem 0.45rem;
    border-bottom: 1px solid #e2e8f0;
  }
  .chip {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 2.45rem; padding: 0.4rem 0.7rem;
    border: 1px solid #e2e8f0; border-radius: 8px;
    font: 650 1rem/1.2 system-ui, sans-serif; color: #0f172a;
  }
  .heads {
    display: grid; grid-template-columns: 1fr 1fr;
    padding: 0.35rem 0.35rem 0.25rem;
    text-align: center;
    font: 650 0.78rem/1.2 system-ui, sans-serif;
    color: #64748b;
    border-bottom: 1px solid #e2e8f0;
  }
  .cols {
    position: relative;
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 16rem;
    overflow: hidden;
  }
  .hi {
    position: absolute; left: 0.4rem; right: 0.4rem; top: 50%;
    transform: translateY(-50%);
    height: 2.75rem; border-radius: 8px;
    background: rgba(148,163,184,.22);
    pointer-events: none; z-index: 1;
  }
  .col {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 0;
    padding: 0.25rem 0;
  }
  .col + .col { border-left: 1px solid #f1f5f9; }
  .row {
    height: 2.75rem; display: flex; align-items: center; justify-content: center;
    font: 500 1.05rem/1 system-ui, sans-serif; color: #94a3b8;
    width: 100%;
  }
  .row.is-sel { font-weight: 700; color: #0f172a; }
</style>
</head>
<body>
  <div class="phone" id="open">
    <div class="form" style="filter:blur(1px);opacity:.55">
      <p class="label">Műszaki érvényesség</p>
      <div class="split">
        <div class="cell has-value">2027</div>
        <div class="cell has-value">06</div>
      </div>
    </div>
    <div class="portal">
      <div class="backdrop"></div>
      <div class="stage">
        <header class="head">
          <button type="button" class="close" aria-label="Bezárás">×</button>
          <h2 class="title">Műszaki érvényesség</h2>
          <button type="button" class="done">Kész</button>
        </header>
        <div class="body">
          <div class="card">
            <div class="chip-row">
              <div class="chip"><span>2027. 06</span><span aria-hidden="true">×</span></div>
            </div>
            <div class="heads"><span>Év</span><span>Hó</span></div>
            <div class="cols">
              <div class="hi"></div>
              <div class="col">
                <div class="row">2025</div>
                <div class="row">2026</div>
                <div class="row is-sel">2027</div>
                <div class="row">2028</div>
                <div class="row">2029</div>
              </div>
              <div class="col">
                <div class="row">04</div>
                <div class="row">05</div>
                <div class="row is-sel">06</div>
                <div class="row">07</div>
                <div class="row">08</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
