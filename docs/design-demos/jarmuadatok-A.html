<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A — jelenlegi hiba</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#eef1f5;color:#000;font-family:Manrope,sans-serif;padding:28px}
  .card{max-width:640px;margin:0 auto;background:#fffaf9;border:1px solid #e8b4b0;border-radius:10px;padding:1.2rem 1.3rem 1.4rem}
  .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:.22rem .5rem;border-radius:4px;background:#fde8e6;color:#8a1f18;margin-bottom:.65rem}
  h1{margin:0 0 1rem;font-size:1.15rem}
  h2{margin:1rem 0 .55rem;font-size:1.02rem;font-weight:800}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem 2rem}
  .kv{display:grid;grid-template-columns:1fr auto;gap:.75rem;padding:.38rem 0;border-bottom:1px solid #eef1f5;font-size:.92rem}
  dt{margin:0;color:#667085}
  dd{margin:0;font-weight:700;color:#1565c0;text-align:right}
</style>
</head>
<body>
<article class="card">
  <span class="tag">A — jelenlegi (hiba)</span>
  <h1>Szétcsúszott + kék értékek</h1>
  <div class="grid">
    <div class="kv"><dt>Sebességváltó</dt><dd>Manuális (6 seb.)</dd></div>
    <div class="kv"><dt>Futásteljesítmény</dt><dd>167 543 km</dd></div>
    <div class="kv"><dt>Üzemanyag</dt><dd>Benzin</dd></div>
    <div class="kv"><dt>Hajtás</dt><dd>Első kerék</dd></div>
  </div>
  <h2>Karosszéria és technika</h2>
  <div class="grid">
    <div class="kv"><dt>Állapot</dt><dd>Normál</dd></div>
    <div class="kv"><dt>Jármű típusa</dt><dd>Egyterű</dd></div>
    <div class="kv"><dt>Hengerűrtartalom</dt><dd>1400 cm³</dd></div>
    <div class="kv"><dt>Ajtók száma</dt><dd>5</dd></div>
    <div class="kv"><dt>Műszaki érvényesség</dt><dd>08.2027</dd></div>
  </div>
</article>
</body>
</html>
