<!DOCTYPE html>

  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bymy-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
        try {
          var raw = sessionStorage.getItem("bymy-auth-user");
          var user = raw ? JSON.parse(raw) : null;
          var loggedIn = !!(user && user.email);
          document.documentElement.setAttribute("data-auth", loggedIn ? "member" : "guest");
          if (!loggedIn) {
            window.location.replace("/belepes.html?next=" + encodeURIComponent("/fiok.html"));
            return;
          }
          var first = "";
          if (user) {
            first = String((user.profile && user.profile.firstName) || "").trim();
            if (!first && user.displayName && String(user.displayName).indexOf("@") < 0) {
              first = String(user.displayName).trim().split(/\s+/)[0] || "";
            }
            if (!first && user.email) {
              var local = String(user.email).split("@")[0] || "";
              first = local ? local.charAt(0).toUpperCase() + local.slice(1) : "";
            }
          }
          if (first) {
            document.addEventListener("DOMContentLoaded", function () {
              document.querySelectorAll("span[data-auth-firstname]").forEach(function (el) {
                el.textContent = first;
              });
            });
          }
        } catch (e) {
          document.documentElement.setAttribute("data-auth", "guest");
        }
      })();
    </script>

      <p class="fiok-signed-in">Bejelentkezve mint <span data-fiok-display>—</span></p>
      <button type="button" class="fiok-logout" data-auth-logout>Kijelentkezés</button>
    </main>

    <script type="module">
      import { initSiteAuth, getAuthUser } from "/js/site-auth.js?v=fiokPage3";
      initSiteAuth();
      const user = getAuthUser();
      const el = document.querySelector("[data-fiok-display]");
      if (el && user) {
        const name = [user.profile?.firstName, user.profile?.lastName].filter(Boolean).join(" ").trim();
        el.textContent = name || user.displayName || user.email || "—";
      }
    </script>
