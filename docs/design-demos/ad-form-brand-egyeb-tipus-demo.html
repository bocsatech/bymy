<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demó — Gyártmány/Modell + Egyéb típus egy fehér boxban</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #e8eef3;
      color: #111;
      padding: 1.25rem 1rem 2rem;
    }
    .wrap { max-width: 390px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
    .brand-box {
      background: #fff;
      border-radius: 1.375rem;
      padding: 1.1rem 1.1rem 1.2rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .row { display: grid; gap: 0.55rem; }
    .row--egyeb { gap: 0.45rem; margin-top: 0.15rem; }
    label { font: 700 0.94rem/1.2 system-ui, sans-serif; margin: 0; }
    .row--egyeb label { font-size: 0.875rem; }
    .pill {
      position: relative;
      height: 3rem;
      border-radius: 999px;
      border: 1px solid #d0d5dd;
      background: #fff;
      display: flex;
      align-items: center;
      padding: 0 2.35rem 0 1.25rem;
      font: 600 1rem/1.2 system-ui, sans-serif;
      color: #111;
    }
    .pill::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 1.05rem;
      width: 0.42rem;
      height: 0.42rem;
      margin-top: -0.22rem;
      border-top: 1.5px solid #667085;
      border-right: 1.5px solid #667085;
      transform: rotate(45deg);
    }
    .pill.is-empty { color: #6b7280; font-weight: 500; }
    .pill .x {
      position: absolute;
      right: 2.4rem;
      border: 0;
      background: transparent;
      font-size: 1.25rem;
      line-height: 1;
      color: #667085;
      cursor: default;
    }
    .underline {
      border: 0;
      border-bottom: 1.5px solid #cfd6dd;
      background: transparent;
      min-height: 2.65rem;
      padding: 0.45rem 0;
      font: 500 1rem/1.3 system-ui, sans-serif;
      width: 100%;
      outline: none;
    }
    .alap {
      background: #fff;
      border-radius: 1.375rem;
      padding: 1.1rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      font: 800 1.125rem/1.2 system-ui, sans-serif;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .alap span { color: #64748b; font-size: 0.65rem; transform: rotate(180deg); }
    .note { font: 500 0.78rem/1.35 system-ui, sans-serif; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="note">Demó: Egyéb típus a Gyártmány / Modell alatt, ugyanabban a fehér boxban</p>
    <div class="brand-box">
      <div class="row">
        <label>Gyártmány &amp; Modell: <span style="color:#e11">*</span></label>
        <div class="pill">AIWAYS · U5<button class="x" type="button" aria-label="törlés">×</button></div>
      </div>
      <div class="row row--egyeb">
        <label for="egyeb">Egyéb típus:</label>
        <input id="egyeb" class="underline" type="text" value="" placeholder="" />
      </div>
    </div>
    <div class="alap">Alapadatok <span>▼</span></div>
  </div>
</body>
</html>
