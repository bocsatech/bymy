<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>bymy – Szűrő demó (Alapadatok)</title>
  <style>
    :root {
      --bg: #e8eef3;
      --card: #ffffff;
      --text: #1a1d21;
      --muted: #6b7280;
      --line: #cfd6dd;
      --accent: #f5c518;
      --accent-ink: #111;
      --pill: #ffffff;
      --nav: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #94a3b8;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .phone {
      width: 390px;
      min-height: 844px;
      margin: 24px auto;
      background: var(--bg);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.28);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .status {
      height: 44px;
      padding: 12px 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font: 600 14px/1 system-ui;
      color: #111;
    }
    .status-icons { display: flex; gap: 6px; align-items: center; font-size: 12px; }
    .topbar {
      height: 48px;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      padding: 0 8px;
    }
    .back {
      width: 40px; height: 40px; border: 0; background: transparent;
      font-size: 28px; line-height: 1; color: #111; cursor: default;
    }
    .topbar h1 {
      margin: 0; text-align: center; font: 700 18px/1.2 system-ui; letter-spacing: -0.02em;
    }
    .scroll {
      flex: 1;
      overflow: hidden;
      padding: 4px 16px 120px;
    }
    .hero {
      margin: 8px 0 18px;
      font: 800 28px/1.15 system-ui;
      letter-spacing: -0.03em;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font: 800 15px/1 system-ui;
      color: #111;
    }
    .brand-logo span {
      background: var(--accent);
      color: #111;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 13px;
      letter-spacing: -0.02em;
    }
    .section-label {
      font: 700 15px/1.2 system-ui;
      margin: 0 0 10px;
      color: #111;
    }
    .pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 18px 0 20px;
      background: var(--pill);
      border-radius: 999px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      margin-bottom: 22px;
    }
    .pill .ph { color: var(--muted); font: 500 16px/1 system-ui; }
    .pill .chev {
      width: 10px; height: 10px;
      border-top: 2px solid #64748b;
      border-right: 2px solid #64748b;
      transform: rotate(45deg);
      margin-right: 2px;
    }
    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 18px 18px 28px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .card > h2 {
      margin: 0 0 16px;
      font: 800 18px/1.2 system-ui;
      letter-spacing: -0.02em;
    }
    .field { margin-bottom: 18px; }
    .field > label {
      display: block;
      font: 700 14px/1.2 system-ui;
      margin-bottom: 8px;
      color: #111;
    }
    .underline {
      border: 0;
      border-bottom: 1.5px solid var(--line);
      background: transparent;
      width: 100%;
      padding: 10px 2px 8px;
      font: 500 15px/1.2 system-ui;
      color: var(--muted);
      outline: none;
    }
    .range {
      display: grid;
      grid-template-columns: 1fr 18px 1fr;
      align-items: end;
      gap: 6px;
    }
    .range .sep {
      text-align: center;
      color: #94a3b8;
      padding-bottom: 10px;
      font-weight: 600;
    }
    .cell {
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1.5px solid var(--line);
      padding: 8px 2px;
      min-height: 42px;
    }
    .cell .prefix {
      color: #2563eb;
      font: 700 15px/1 system-ui;
      flex: 0 0 auto;
    }
    .cell .suffix {
      color: #2563eb;
      font: 700 13px/1 system-ui;
      margin-left: auto;
    }
    .cell .ph {
      color: var(--muted);
      font: 500 15px/1 system-ui;
    }
    .cta-wrap {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 78px;
      z-index: 5;
    }
    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      font: 800 16px/1 system-ui;
      letter-spacing: -0.01em;
      box-shadow: 0 10px 24px rgba(245, 197, 24, 0.45);
      border: 0;
      width: 100%;
    }
    .tabbar {
      height: 72px;
      background: var(--nav);
      border-top: 1px solid #e5e7eb;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 6px 4px 10px;
      position: relative;
      z-index: 2;
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font: 600 10px/1 system-ui;
      color: #6b7280;
    }
    .tab .ico {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      font-size: 18px;
      border-radius: 999px;
    }
    .tab.is-active { color: #111; }
    .tab.is-active .ico {
      background: rgba(245, 197, 24, 0.35);
    }
    .note {
      text-align: center;
      color: #e2e8f0;
      font: 500 12px/1.4 system-ui;
      margin: 0 0 24px;
    }
  </style>
</head>
<body>
  <div class="phone" id="demo">
    <div class="status">
      <span>17:45</span>
      <span class="status-icons">■■■ ▓ 68</span>
    </div>
    <div class="topbar">
      <button class="back" type="button" aria-hidden="true">‹</button>
      <h1>Szűrő</h1>
      <span></span>
    </div>
    <div class="scroll">
      <div class="brand-logo"><span>bymy</span> autókereső</div>

      <div class="section-label">Gyártmány &amp; Modell</div>
      <div class="pill">
        <span class="ph">Gyártmány / Modell</span>
        <span class="chev" aria-hidden="true"></span>
      </div>

      <div class="card">
        <h2>Alapadatok</h2>

        <div class="field">
          <label>Keresőszó</label>
          <div class="underline">pl. felszereltség vagy típus…</div>
        </div>

        <div class="field">
          <label>Vételár</label>
          <div class="range">
            <div class="cell"><span class="prefix">Ft</span><span class="ph">tól</span></div>
            <div class="sep">–</div>
            <div class="cell"><span class="prefix">Ft</span><span class="ph">ig</span></div>
          </div>
        </div>

        <div class="field">
          <label>Gyártási év</label>
          <div class="range">
            <div class="cell"><span class="ph">tól</span><span class="suffix">év</span></div>
            <div class="sep">–</div>
            <div class="cell"><span class="ph">ig</span><span class="suffix">év</span></div>
          </div>
        </div>

        <div class="field" style="margin-bottom: 0">
          <label>Kilométeróra állás</label>
          <div class="range">
            <div class="cell"><span class="ph">tól</span><span class="suffix">km</span></div>
            <div class="sep">–</div>
            <div class="cell"><span class="ph">ig</span><span class="suffix">km</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="cta-wrap">
      <button class="cta" type="button">25 találat megjelenítése</button>
    </div>

    <nav class="tabbar" aria-label="Alsó menü">
      <div class="tab"><div class="ico">⌂</div>Kezdőlap</div>
      <div class="tab is-active"><div class="ico">⌕</div>Keresés</div>
      <div class="tab"><div class="ico">＋</div>Feladás</div>
      <div class="tab"><div class="ico">💬</div>Üzenetek</div>
      <div class="tab"><div class="ico">☺</div>Profil</div>
    </nav>
  </div>
  <p class="note">bymy demó · AutoScout-stílusú Alapadatok · magyar mezőnevek</p>
</body>
</html>
