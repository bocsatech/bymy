<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C — egy sorban</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#eef1f5;color:#000;font-family:Manrope,sans-serif;padding:28px}
  .card{max-width:640px;margin:0 auto;background:#fff;border:1px solid #d8dee6;border-radius:10px;padding:1.2rem 1.3rem 1.4rem}
  .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:.22rem .5rem;border-radius:4px;background:#e8f6ec;color:#166534;margin-bottom:.65rem}
  h1{margin:0 0 1rem;font-size:1.15rem}
  h2{grid-column:1/-1;margin:.5rem 0 .15rem;font-size:1.02rem;font-weight:800}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem 1.75rem}
  .kv{display:flex;flex-wrap:wrap;align-items:baseline;gap:.35rem;margin:0;padding:.32rem 0;border-bottom:1px solid #e4e8ee;font-size:.92rem}
  dt{margin:0;font-weight:600}
  dt::after{content:":"}
  dd{margin:0;font-weight:800}
</style>
</head>
<body>
<article class="card">
  <span class="tag">C — egy sorban</span>
  <h1>Címke: érték, balra zárt</h1>
  <div class="grid">
    <div class="kv"><dt>Sebességváltó</dt><dd>Manuális (6 seb.)</dd></div>
    <div class="kv"><dt>Futásteljesítmény</dt><dd>167 543 km</dd></div>
    <div class="kv"><dt>Üzemanyag</dt><dd>Benzin</dd></div>
    <div class="kv"><dt>Hajtás</dt><dd>Első kerék</dd></div>
    <h2>Karosszéria és technika</h2>
    <div class="kv"><dt>Állapot</dt><dd>Normál</dd></div>
    <div class="kv"><dt>Jármű típusa</dt><dd>Egyterű</dd></div>
    <div class="kv"><dt>Hengerűrtartalom</dt><dd>1400 cm³</dd></div>
    <div class="kv"><dt>Ajtók száma</dt><dd>5</dd></div>
    <div class="kv"><dt>Műszaki érvényesség</dt><dd>08.2027</dd></div>
  </div>
</article>
</body>
</html>
