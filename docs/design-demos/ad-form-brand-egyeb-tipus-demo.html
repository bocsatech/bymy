<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demó — Gyártmány box + Egyéb típus</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 1.25rem 1rem 2rem;
      background: #e8eef3;
      font: 400 16px/1.35 system-ui, -apple-system, sans-serif;
      color: #111;
    }
    .stack {
      max-width: 390px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    .brand-box,
    .alap-box {
      background: #fff;
      border-radius: 1.375rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      padding: 1.1rem 1.15rem 1.25rem;
    }
    .brand-box {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      display: block;
      font: 700 0.94rem/1.2 system-ui, sans-serif;
      margin: 0 0 0.55rem;
    }
    .req { color: #e11d48; }
    .pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 3rem;
      padding: 0 1rem 0 1.25rem;
      border: 1px solid #d0d5dd;
      border-radius: 999px;
      background: #f8fafc;
      font: 600 1rem/1.2 system-ui, sans-serif;
    }
    .pill .meta { display: flex; align-items: center; gap: 0.65rem; color: #667085; }
    .pill .x { font-size: 1.15rem; line-height: 1; }
    .pill .chev {
      width: 0.42rem;
      height: 0.42rem;
      border-top: 1.5px solid #667085;
      border-right: 1.5px solid #667085;
      transform: rotate(45deg);
    }
    .underline {
      width: 100%;
      border: 0;
      border-bottom: 1.5px solid #cfd6dd;
      background: transparent;
      padding: 0.55rem 0.1rem 0.5rem;
      font: 500 1rem/1.3 system-ui, sans-serif;
      outline: none;
    }
    .alap-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 3.35rem;
      padding: 0.95rem 1.15rem;
      font: 800 1.125rem/1.2 system-ui, sans-serif;
      letter-spacing: -0.02em;
    }
    .alap-box .tri { color: #2563eb; font-size: 0.75rem; }
    .note {
      max-width: 390px;
      margin: 1rem auto 0;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="stack">
    <section class="brand-box" aria-label="Gyártmány box">
      <div>
        <label>Gyártmány &amp; Modell: <span class="req">*</span></label>
        <div class="pill">
          <span>AIWAYS · U5</span>
          <span class="meta"><span class="x" aria-hidden="true">×</span><span class="chev" aria-hidden="true"></span></span>
        </div>
      </div>
      <div>
        <label for="egyeb">Egyéb típus:</label>
        <input id="egyeb" class="underline" type="text" placeholder="" />
      </div>
    </section>
    <section class="alap-box" aria-label="Alapadatok">
      <span>Alapadatok</span>
      <span class="tri" aria-hidden="true">▲</span>
    </section>
  </div>
  <p class="note">Demó: Egyéb típus a gyártmány/modell fehér boxában.</p>
</body>
</html>
