<!DOCTYPE html>

  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bymy-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
                
        try {
          var raw = sessionStorage.getItem("bymy-auth-user");
          var user = raw ? JSON.parse(raw) : null;
          var loggedIn = !!(user && user.email);
          document.documentElement.setAttribute("data-auth", loggedIn ? "member" : "guest");
          var first = "";
          if (user) {
            first = String((user.profile && user.profile.firstName) || "").trim();
            if (!first && user.displayName && String(user.displayName).indexOf("@") < 0) {
              first = String(user.displayName).trim().split(/\s+/)[0] || "";
            }
            if (!first && user.email) {
              var local = String(user.email).split("@")[0] || "";
              first = local ? local.charAt(0).toUpperCase() + local.slice(1) : "";
            }
          }
          if (first) {
            document.addEventListener("DOMContentLoaded", function () {
              document.querySelectorAll("span[data-auth-firstname]").forEach(function (el) {
                el.textContent = first;
              });
              var letter = first.charAt(0).toUpperCase();
              document.querySelectorAll("[data-avatar-letter]").forEach(function (el) {
                el.textContent = letter;
              });
            });
          }
        } catch (e) {
          document.documentElement.setAttribute("data-auth", "guest");
        }
      })();
    </script>
