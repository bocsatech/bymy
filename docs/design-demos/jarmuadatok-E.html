<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E — ajánlott</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#eef1f5;color:#000;font-family:Manrope,sans-serif;padding:28px}
  .card{max-width:640px;margin:0 auto;background:#fff;border:1px solid #d8dee6;border-radius:10px;padding:1.2rem 1.3rem 1.4rem}
  .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:.22rem .5rem;border-radius:4px;background:#e8f6ec;color:#166534;margin-bottom:.65rem}
  h1{margin:0 0 1rem;font-size:1.15rem}
  .block+.block{margin-top:1.1rem}
  h2{margin:0 0 .65rem;font-size:1.05rem;font-weight:800}
  .grid{display:grid;grid-template-columns:1fr 1fr;column-gap:2rem;row-gap:.75rem}
  dt{margin:0 0 .1rem;font-size:.8rem;font-weight:600}
  dd{margin:0;font-size:1rem;font-weight:800}
</style>
</head>
<body>
<article class="card">
  <span class="tag">E — ajánlott</span>
  <h1>Címke fölött, érték alatt, fekete</h1>
  <div class="block">
    <h2>Alapadatok</h2>
    <dl class="grid">
      <div><dt>Sebességváltó</dt><dd>Manuális (6 seb.)</dd></div>
      <div><dt>Futásteljesítmény</dt><dd>167 543 km</dd></div>
      <div><dt>Üzemanyag</dt><dd>Benzin</dd></div>
      <div><dt>Hajtás</dt><dd>Első kerék</dd></div>
    </dl>
  </div>
  <div class="block">
    <h2>Karosszéria és technika</h2>
    <dl class="grid">
      <div><dt>Állapot</dt><dd>Normál</dd></div>
      <div><dt>Jármű típusa</dt><dd>Egyterű</dd></div>
      <div><dt>Hengerűrtartalom</dt><dd>1400 cm³</dd></div>
      <div><dt>Ajtók száma</dt><dd>5</dd></div>
      <div><dt>Műszaki érvényesség</dt><dd>08.2027</dd></div>
    </dl>
  </div>
</article>
</body>
</html>
