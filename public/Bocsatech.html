<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Bocsatech — admin</title>
    <link rel="stylesheet" href="/css/bocsatech.css?v=adminDealers2" />
    <link rel="stylesheet" href="/css/bymy-logo-size.css?v=deskHdr5" />
  </head>
  <body>
    <noscript>
      <div class="wrap">
        <h1>Bocsatech</h1>
        <p class="err">JavaScript szükséges az admin felülethez.</p>
      </div>
    </noscript>
    <div id="app">
      <div class="wrap">
        <h1>Bocsatech</h1>
        <p class="sub">Admin belépés — jelszó + email kód.</p>
        <p class="hint" id="boot-hint">Script betöltése…</p>
      </div>
    </div>
    <script type="module">
      const bootHint = document.getElementById("boot-hint");
      const bootFail = (msg) => {
        const app = document.getElementById("app");
        if (!app) return;
        app.innerHTML =
          `<div class="wrap"><h1>Bocsatech</h1>` +
          `<p class="err">${msg}</p>` +
          `<p class="hint">Hard refresh (Cmd+Shift+R). Ha továbbra is fennáll: ` +
          `<a href="https://bymy.hu/Bocsatech.html">bymy.hu/Bocsatech.html</a></p></div>`;
      };
      const bootTimer = setTimeout(() => {
        bootFail("Az admin felület lassan tölt — ellenőrizd a hálózatot, majd frissíts.");
      }, 15000);
      import("/js/bocsatech.js?v=adminDealers2")
        .then(() => {
          clearTimeout(bootTimer);
        })
        .catch((error) => {
          clearTimeout(bootTimer);
          console.error("Bocsatech import:", error);
          bootFail(`Admin script nem töltődött be: ${error?.message || error}`);
        });
    </script>
  </body>
</html>
